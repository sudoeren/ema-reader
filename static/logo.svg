<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34343f"/><stop offset="1" stop-color="#16161a"/>
    </linearGradient>
    <linearGradient id="pages" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9e3d3"/><stop offset="1" stop-color="#fbf7ec"/>
    </linearGradient>
    <linearGradient id="voice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166"/><stop offset="1" stop-color="#ff9f1c"/>
    </linearGradient>
  </defs>
  <!-- the ribbon, hanging out below the pages -->
  <path fill="url(#voice)" d="M158 200h20v50l-10-9-10 9z"/>
  <!-- back cover, pages, front cover -->
  <rect x="60" y="30" width="154" height="204" rx="15" fill="#0c0c0f"/>
  <rect x="58" y="27" width="150" height="200" rx="11" fill="url(#pages)"/>
  <g stroke="#d8d1bf" stroke-width="1.5"><path d="M203 36v186M199 34v190"/></g>
  <rect x="42" y="20" width="154" height="204" rx="15" fill="url(#cover)"/>
  <rect x="42.75" y="20.75" width="152.5" height="202.5" rx="14.25" fill="none" stroke="#fff" stroke-opacity=".14" stroke-width="1.5"/>
  <!-- the spine -->
  <path d="M42 35a15 15 0 0 1 15-15h7v204h-7a15 15 0 0 1-15-15z" fill="#000" opacity=".28"/>
  <path d="M64 20v204" stroke="#fff" stroke-opacity=".08" stroke-width="2"/>
  <!-- the voice on the cover -->
  <g fill="url(#voice)">
    <rect x="80" y="105" width="13" height="34" rx="6.5"/>
    <rect x="101" y="84" width="13" height="76" rx="6.5"/>
    <rect x="122" y="62" width="13" height="120" rx="6.5"/>
    <rect x="143" y="90" width="13" height="64" rx="6.5"/>
    <rect x="164" y="107" width="13" height="30" rx="6.5"/>
  </g>
</svg>
