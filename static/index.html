<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EMA Reader</title>
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #f7f3ea; --surface: #fffdf8; --line: #e4dccb; --ink: #23223a; --muted: #7b7667;
    --accent: #e8870e; --accent-ink: #ffffff; --mark: #ffe2a8; --danger: #b3261e;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14172e; --surface: #1c2040; --line: #2d3260; --ink: #ece8dc; --muted: #9a98ad;
      --accent: #ffb238; --accent-ink: #14172e; --mark: #4b3d14; --danger: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 14px; }
  button:hover { border-color: var(--accent); }
  button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  button.ghost { border-color: transparent; background: none; }
  [hidden] { display: none !important; }

  header { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
  header img { width: 34px; height: 34px; }
  header h1 { font-size: 18px; margin: 0; letter-spacing: 0.2px; }
  header .title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }

  /* library */
  #library { max-width: 980px; margin: 0 auto; padding: 28px 20px 60px; }
  .add { border: 2px dashed var(--line); border-radius: 16px; padding: 26px 20px; text-align: center; background: var(--surface); transition: border-color .15s, background .15s; }
  .add.over { border-color: var(--accent); background: var(--mark); }
  .add p { margin: 0 0 14px; color: var(--muted); }
  .add .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .add input[type=url] { flex: 1 1 280px; max-width: 420px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
  #status { min-height: 22px; margin: 12px 0 0; font-size: 14px; color: var(--muted); }
  #status.error { color: var(--danger); }
  .books { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; margin-top: 26px; }
  .book { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 18px 16px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; min-height: 150px; }
  .book:hover { border-color: var(--accent); }
  .book h2 { font-family: var(--serif); font-size: 19px; line-height: 1.25; margin: 0 26px 0 0; overflow-wrap: anywhere; }
  .book .by { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
  .book .meta { margin-top: auto; padding-top: 10px; color: var(--muted); font-size: 13px; display: flex; justify-content: space-between; }
  .bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .book .remove { position: absolute; top: 8px; right: 8px; padding: 2px 8px; font-size: 18px; line-height: 1.2; color: var(--muted); }
  .book .remove:hover { color: var(--danger); }
  .empty { text-align: center; color: var(--muted); margin-top: 40px; }

  /* reader */
  #reader { display: grid; grid-template-columns: 270px 1fr; height: calc(100% - 63px); }
  #chapters { border-right: 1px solid var(--line); overflow-y: auto; padding: 10px 8px 120px; }
  #chapters button { display: block; width: 100%; text-align: left; border: none; background: none; padding: 9px 12px; border-radius: 8px; font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
  #chapters button:hover { background: var(--surface); }
  #chapters button.current { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: inset 3px 0 0 var(--accent); }
  #page { overflow-y: auto; padding: 34px 24px 160px; scroll-behavior: smooth; }
  #text { max-width: 680px; margin: 0 auto; font-family: var(--serif); font-size: 20px; line-height: 1.75; }
  #text h2 { font-size: 30px; line-height: 1.2; margin: 0 0 28px; }
  #text p { margin: 0 0 1.1em; }
  #text span { border-radius: 4px; cursor: pointer; padding: 2px 0; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  #text span:hover { background: var(--line); }
  #text span.current { background: var(--mark); }

  #player { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 10px 20px 12px; }
  #player .seek { height: 4px; background: var(--line); border-radius: 2px; margin-bottom: 10px; overflow: hidden; }
  #player .seek i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  #player .controls { display: flex; align-items: center; gap: 10px; max-width: 980px; margin: 0 auto; flex-wrap: wrap; }
  #player .controls .spacer { flex: 1; }
  #play { width: 46px; height: 46px; border-radius: 50%; padding: 0; font-size: 18px; }
  #position { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 86px; }
  label.speed { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  label.speed input { width: 120px; accent-color: var(--accent); }
  label.speed output { min-width: 38px; font-variant-numeric: tabular-nums; color: var(--ink); }
  #menu { display: none; }

  @media (max-width: 760px) {
    #reader { grid-template-columns: 1fr; }
    #chapters { position: fixed; inset: 63px 0 0 0; z-index: 5; background: var(--bg); border: none; display: none; }
    #chapters.open { display: block; }
    #menu { display: inline-block; }
    #text { font-size: 18px; }
    #page { padding: 22px 16px 190px; }
    label.speed input { width: 90px; }
  }
</style>
</head>
<body>

<header>
  <button id="back" class="ghost" hidden aria-label="Back to library">←</button>
  <img src="/static/logo.svg" alt="">
  <h1>EMA Reader</h1>
  <span class="title" id="book-title"></span>
  <button id="menu" class="ghost" hidden aria-label="Chapters">☰</button>
</header>

<main id="library">
  <div class="add" id="drop">
    <p>Drop an EPUB, PDF, text or Markdown file here, or paste the address of an article.</p>
    <div class="row">
      <button class="primary" id="choose">Choose a file</button>
      <input type="file" id="file" accept=".epub,.pdf,.txt,.md,.html,.htm" hidden>
      <input type="url" id="url" placeholder="https://…" aria-label="Article address">
      <button id="add-url">Add article</button>
    </div>
    <p id="status" role="status"></p>
  </div>
  <div class="books" id="books"></div>
  <p class="empty" id="empty" hidden>Your library is empty. Add something to listen to.</p>
</main>

<main id="reader" hidden>
  <nav id="chapters" aria-label="Chapters"></nav>
  <div id="page"><article id="text"></article></div>
  <div id="player">
    <div class="seek"><i id="seek"></i></div>
    <div class="controls">
      <button id="prev" aria-label="Previous sentence">⏮</button>
      <button id="play" class="primary" aria-label="Play">▶</button>
      <button id="next" aria-label="Next sentence">⏭</button>
      <span id="position"></span>
      <span class="spacer"></span>
      <label class="speed">Speed
        <input type="range" id="speed" min="0.6" max="1.6" step="0.05" value="1">
        <output id="speed-value">1.00×</output>
      </label>
      <button id="download" title="Download this chapter as a WAV file">Download chapter</button>
    </div>
  </div>
</main>

<audio id="audio" preload="auto"></audio>

<script>
const $ = id => document.getElementById(id);
const audio = $("audio");

// how long to wait between sentences, in milliseconds
const SENTENCE_PAUSE = 150, PARAGRAPH_PAUSE = 500;
const PREFETCH = 3, CACHE_LIMIT = 40;

let book = null;        // the open book
let chapter = 0;        // index of the open chapter
let sentences = [];     // the chapter's sentences: {text, el, endsParagraph}
let index = 0;          // the sentence being read
let playing = false;
let run = 0;            // bumped whenever playback is restarted, so stale loops stop
let loaded = null;      // cache key of the audio currently in the <audio> element
const cache = new Map();

let speed = 1;
try { speed = Number(localStorage.getItem("speed")) || 1; } catch {}

async function api(path, options) {
  const response = await fetch(path, options);
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || "request failed");
  return data;
}

/* library */

async function showLibrary() {
  stop();
  book = null;
  clearTimeout(saveTimer);
  await pendingSave?.();   // so the library shows the position just left
  $("reader").hidden = true; $("library").hidden = false;
  $("back").hidden = true; $("menu").hidden = true; $("book-title").textContent = "";
  document.title = "EMA Reader";
  const books = await api("/api/books");
  $("empty").hidden = books.length > 0;
  $("books").replaceChildren(...books.map(card));
}

function card(b) {
  const el = document.createElement("div");
  el.className = "book"; el.tabIndex = 0;
  const title = document.createElement("h2"); title.textContent = b.title;
  const by = document.createElement("div"); by.className = "by"; by.textContent = b.author || "";
  const percent = b.sentences ? Math.round(100 * b.done / b.sentences) : 0;
  const meta = document.createElement("div"); meta.className = "meta";
  meta.innerHTML = `<span>${b.chapters} ${b.chapters === 1 ? "chapter" : "chapters"}</span><span>${percent}%</span>`;
  const bar = document.createElement("div"); bar.className = "bar";
  bar.innerHTML = `<i style="width:${percent}%"></i>`;
  const remove = document.createElement("button");
  remove.className = "remove ghost"; remove.textContent = "×"; remove.title = "Remove from library";
  remove.setAttribute("aria-label", `Remove ${b.title}`);
  remove.onclick = async e => {
    e.stopPropagation();
    if (remove.dataset.armed) { await api(`/api/books/${b.id}`, {method: "DELETE"}); showLibrary(); }
    else { remove.dataset.armed = 1; remove.textContent = "Remove?"; setTimeout(() => { delete remove.dataset.armed; remove.textContent = "×"; }, 2500); }
  };
  el.append(title, by, meta, bar, remove);
  el.onclick = () => openBook(b.id);
  el.onkeydown = e => { if (e.key === "Enter") openBook(b.id); };
  return el;
}

function status(message, error = false) {
  $("status").textContent = message;
  $("status").className = error ? "error" : "";
}

async function add(request, label) {
  status(`Adding ${label}…`);
  try {
    const added = await request();
    status("");
    openBook(added.id);
  } catch (e) {
    status(e.message, true);
  }
}

const addFile = file => add(() => api(`/api/books?name=${encodeURIComponent(file.name)}`, {method: "POST", body: file}), file.name);
const addUrl = url => add(() => api("/api/books", {method: "POST", body: JSON.stringify({url})}), "the article");

$("choose").onclick = () => $("file").click();
$("file").onchange = () => { if ($("file").files[0]) addFile($("file").files[0]); $("file").value = ""; };
$("add-url").onclick = () => { const url = $("url").value.trim(); if (url) { addUrl(url); $("url").value = ""; } };
$("url").onkeydown = e => { if (e.key === "Enter") $("add-url").click(); };
const drop = $("drop");
window.addEventListener("dragover", e => { e.preventDefault(); if (!book) drop.classList.add("over"); });
window.addEventListener("dragleave", e => { if (!e.relatedTarget) drop.classList.remove("over"); });
window.addEventListener("drop", e => {
  e.preventDefault(); drop.classList.remove("over");
  if (!book && e.dataTransfer.files[0]) addFile(e.dataTransfer.files[0]);
});

/* reader */

async function openBook(id) {
  book = await api(`/api/books/${id}`);
  $("library").hidden = true; $("reader").hidden = false;
  $("back").hidden = false; $("menu").hidden = false;
  $("book-title").textContent = book.title; document.title = `${book.title} · EMA Reader`;
  $("chapters").replaceChildren(...book.chapters.map((c, i) => {
    const b = document.createElement("button");
    b.textContent = c.title;
    b.onclick = () => { openChapter(i, 0, playing); $("chapters").classList.remove("open"); };
    return b;
  }));
  openChapter(book.progress.chapter, book.progress.sentence, false);
}

function openChapter(number, sentence, keepPlaying) {
  stop();
  chapter = number;
  sentences = [];
  const heading = document.createElement("h2");
  heading.textContent = book.chapters[chapter].title;
  const paragraphs = book.chapters[chapter].paragraphs.map(parts => {
    const p = document.createElement("p");
    parts.forEach((text, i) => {
      const el = document.createElement("span");
      el.textContent = text;
      const at = sentences.length;
      el.onclick = () => jump(at, true);
      sentences.push({text, el, endsParagraph: i === parts.length - 1});
      p.append(el, " ");
    });
    return p;
  });
  $("text").replaceChildren(heading, ...paragraphs);
  [...$("chapters").children].forEach((b, i) => b.classList.toggle("current", i === chapter));
  $("page").scrollTop = 0;
  select(Math.min(sentence, sentences.length - 1));
  if (keepPlaying) play();
}

function select(i) {
  sentences[index]?.el.classList.remove("current");
  index = i;
  const current = sentences[index];
  current.el.classList.add("current");
  const box = current.el.getBoundingClientRect(), page = $("page").getBoundingClientRect();
  if (box.top < page.top + 60 || box.bottom > page.bottom - 160) {
    $("page").scrollTop += box.top - page.top - page.height / 3;
  }
  $("position").textContent = `${index + 1} / ${sentences.length}`;
  $("seek").style.width = `${100 * (index + 1) / sentences.length}%`;
  saveProgress();
}

let saveTimer, pendingSave = null;
function saveProgress() {
  clearTimeout(saveTimer);
  const id = book.id, body = JSON.stringify({chapter, sentence: index});
  pendingSave = () => { pendingSave = null; return fetch(`/api/books/${id}/progress`, {method: "PUT", body, keepalive: true}); };
  saveTimer = setTimeout(() => pendingSave?.(), 600);
}

/* playback: one request per sentence, the next few fetched ahead */

function clip(i) {
  const key = `${book.id}:${chapter}:${i}:${speed}`;
  if (!cache.has(key)) {
    const url = fetch("/tts", {method: "POST", body: JSON.stringify({text: sentences[i].text, speed})})
      .then(r => { if (!r.ok) throw new Error("could not make the audio"); return r.blob(); })
      .then(blob => URL.createObjectURL(blob));
    url.catch(() => cache.delete(key));
    cache.set(key, url);
    if (cache.size > CACHE_LIMIT) {
      const [oldest, stale] = cache.entries().next().value;
      cache.delete(oldest);
      if (oldest !== loaded) stale.then(URL.revokeObjectURL, () => {});
    }
  }
  return {key, url: cache.get(key)};
}

const ended = () => new Promise(resolve => audio.addEventListener("ended", resolve, {once: true}));
const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

async function play() {
  if (!book) return;
  const mine = ++run;
  setPlaying(true);
  try {
    while (mine === run) {
      for (let i = 1; i <= PREFETCH && index + i < sentences.length; i++) clip(index + i);
      const {key, url} = clip(index);
      const src = await url;
      if (mine !== run) return;
      if (loaded !== key) { audio.src = src; loaded = key; }   // otherwise resume where it was paused
      const done = ended();
      await audio.play();
      await done;
      if (mine !== run) return;
      loaded = null;
      await wait(sentences[index].endsParagraph ? PARAGRAPH_PAUSE : SENTENCE_PAUSE);
      if (mine !== run) return;
      if (index + 1 < sentences.length) select(index + 1);
      else if (chapter + 1 < book.chapters.length) return openChapter(chapter + 1, 0, true);
      else break;
    }
  } catch (e) {
    if (mine !== run) return;   // interrupted on purpose
    $("position").textContent = e.message;
  }
  if (mine === run) setPlaying(false);
}

function pause() {
  run++;
  audio.pause();
  setPlaying(false);
}

function stop() {
  pause();
  loaded = null;
}

function setPlaying(value) {
  playing = value;
  $("play").textContent = value ? "⏸" : "▶";
  $("play").setAttribute("aria-label", value ? "Pause" : "Play");
  if ("mediaSession" in navigator) navigator.mediaSession.playbackState = value ? "playing" : "paused";
}

function jump(i, start = playing) {
  if (i < 0 || i >= sentences.length) return;
  stop();
  select(i);
  if (start) play();
}

const toggle = () => playing ? pause() : play();
$("play").onclick = toggle;
$("prev").onclick = () => jump(index - 1);
$("next").onclick = () => jump(index + 1);
$("back").onclick = showLibrary;
$("menu").onclick = () => $("chapters").classList.toggle("open");
$("download").onclick = () => { location.href = `/api/books/${book.id}/chapters/${chapter}/audio?speed=${speed}`; };

function showSpeed() { $("speed").value = speed; $("speed-value").textContent = speed.toFixed(2) + "×"; }
$("speed").oninput = () => { speed = Number($("speed").value); showSpeed(); };
$("speed").onchange = () => {
  try { localStorage.setItem("speed", speed); } catch {}
  if (playing) jump(index, true);   // re-read the current sentence at the new speed
  else loaded = null;
};
showSpeed();

document.addEventListener("keydown", e => {
  if (!book || e.target.matches("input, button")) return;
  if (e.key === " ") { e.preventDefault(); toggle(); }
  else if (e.key === "ArrowRight") jump(index + 1);
  else if (e.key === "ArrowLeft") jump(index - 1);
});

if ("mediaSession" in navigator) {
  navigator.mediaSession.setActionHandler("play", play);
  navigator.mediaSession.setActionHandler("pause", pause);
  navigator.mediaSession.setActionHandler("nexttrack", () => jump(index + 1));
  navigator.mediaSession.setActionHandler("previoustrack", () => jump(index - 1));
}

showLibrary();
</script>
</body>
</html>
