<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EMA Reader</title>
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/fonts/fonts.css">
<style>
  :root {
    --bg: #ffffff; --surface: #ffffff; --ink: #16161a; --on-ink: #ffffff; --text: #2a2a31; --muted: #6b6b75; --faint: #8a8a93;
    --line: #ececef; --strong-line: #d5d5dc; --soft: #f3f3f5; --danger: #c62828;
    --accent: #2b50ff; --accent-soft: #e4eaff; --on-accent: #ffffff;
    --veil: rgba(255,255,255,.86); --shade: rgba(20,20,60,.3); --backdrop: rgba(22,22,26,.35);
    --reading-size: 22px;
    --sans: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    --serif: Newsreader, "Iowan Old Style", Georgia, serif;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #131316; --surface: #1d1d22; --ink: #f2f2f4; --on-ink: #131316; --text: #d6d6dc; --muted: #a0a0ab; --faint: #7d7d88;
    --line: #2a2a31; --strong-line: #3a3a44; --soft: #25252b; --danger: #ff8a80;
    --veil: rgba(19,19,22,.88); --shade: rgba(0,0,0,.6); --backdrop: rgba(0,0,0,.55);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  svg { display: block; flex: none; }
  button, input { font: inherit; color: inherit; }
  button { border: 0; background: none; padding: 0; cursor: pointer; }
  a { color: var(--accent); text-underline-offset: 3px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 18px; border-radius: 10px; background: var(--accent); color: var(--on-accent); font-weight: 600; font-size: 14px; white-space: nowrap; }
  .btn:hover { opacity: .88; }
  .btn.big { padding: 14px 24px; font-size: 15px; border-radius: 999px; }
  .btn.quiet { background: var(--accent-soft); color: var(--ink); }
  .btn.quiet:hover { opacity: .8; }
  .btn.danger { background: none; color: var(--danger); padding-left: 8px; padding-right: 8px; }
  .icon { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; color: var(--muted); }
  .icon:hover { background: var(--accent-soft); color: var(--accent); }

  /* library */
  #library { max-width: 1180px; margin: 0 auto; padding: 22px 44px 70px; }
  .top { display: flex; align-items: center; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; letter-spacing: -.2px; margin-right: auto; }
  .brand img { width: 30px; height: 30px; }
  .search { display: flex; align-items: center; gap: 8px; width: 280px; padding: 0 14px; border-radius: 10px; background: var(--soft); color: var(--faint); }
  .search input { flex: 1; min-width: 0; border: 0; background: none; outline: 0; padding: 9px 0; font-size: 14px; color: var(--ink); }
  .search:focus-within { box-shadow: 0 0 0 2px var(--accent); }
  h2.section { font-size: 13px; font-weight: 600; color: var(--faint); margin: 34px 0 14px; letter-spacing: .2px; }

  .resume { display: flex; align-items: center; gap: 22px; padding: 18px 26px 18px 18px; border: 1px solid var(--line); border-radius: 16px; cursor: pointer; transition: border-color .15s, background .15s; }
  .resume:hover { border-color: var(--accent); background: var(--soft); }
  .resume .cover { width: 84px; padding: 10px 8px; flex: none; }
  .resume .cover strong { font-size: 11px; }
  .resume .cover small { display: none; }
  .resume .info { flex: 1; min-width: 0; }
  .resume h3 { font-family: var(--serif); font-size: 27px; font-weight: 500; margin: 0 0 4px; letter-spacing: -.3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .resume p { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
  .resume .go { width: 58px; height: 58px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; flex: none; transition: transform .15s; }
  .resume:hover .go { transform: scale(1.06); }
  .track { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
  .track i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 28px 22px; }
  .item { position: relative; cursor: pointer; min-width: 0; }
  .cover { position: relative; aspect-ratio: 2 / 3; border-radius: 6px; padding: 14px 12px; display: flex; flex-direction: column; justify-content: space-between; color: #fff; font-family: var(--serif); box-shadow: 0 8px 18px -8px rgba(0,0,0,.45); overflow: hidden; transition: transform .15s, box-shadow .15s; }
  .cover strong { font-size: 17px; font-weight: 600; line-height: 1.15; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
  .cover small { font-size: 10.5px; letter-spacing: .6px; text-transform: uppercase; opacity: .85; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cover.article { background: var(--soft); color: var(--ink); box-shadow: 0 8px 18px -10px rgba(0,0,0,.3), inset 0 0 0 1px var(--line); }
  .cover.article small { text-transform: none; letter-spacing: 0; }
  .cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .item:hover .cover, .item:focus-visible .cover { transform: translateY(-3px); box-shadow: 0 14px 24px -10px rgba(0,0,0,.5); }
  .item h4 { font-size: 14px; font-weight: 600; margin: 12px 0 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item span { font-size: 13px; color: var(--faint); }
  .item .more { position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; border-radius: 50%; background: rgba(0,0,0,.55); color: #fff; display: grid; place-items: center; opacity: 0; }
  .item:hover .more, .item .more:focus-visible { opacity: 1; }
  .none { color: var(--faint); font-size: 14px; }

  .update { display: flex; align-items: center; gap: 12px; margin-top: 18px; padding: 10px 10px 10px 18px; border-radius: 14px; background: var(--accent-soft); font-size: 14.5px; }
  .update b { font-weight: 600; }
  .update span { flex: 1; min-width: 0; }
  .update .btn { padding: 8px 14px; }
  a.btn { text-decoration: none; }
  .notes { white-space: pre-wrap; font-size: 14.5px; line-height: 1.55; color: var(--text); max-height: 260px; overflow-y: auto; margin: 0 0 6px; }
  .how { color: var(--muted); font-size: 14px; line-height: 1.5; margin: 14px 0 0; }
  .how code { display: block; margin-top: 8px; padding: 9px 12px; border-radius: 8px; background: var(--soft); color: var(--ink); font: 13.5px ui-monospace, "SF Mono", Menlo, Consolas, monospace; user-select: all; }
  .about .version button { color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

  .welcome { text-align: center; padding: 70px 20px 0; }
  .welcome h1 { font-family: var(--serif); font-weight: 500; font-size: 38px; letter-spacing: -.6px; margin: 0 0 10px; }
  .welcome p { color: var(--muted); margin: 0 0 30px; font-size: 16px; }

  /* dialogs */
  dialog { border: 0; border-radius: 20px; padding: 0; width: min(520px, calc(100vw - 32px)); max-height: calc(100vh - 48px); background: var(--surface); color: var(--ink); box-shadow: 0 30px 80px -20px var(--shade); }
  dialog::backdrop { background: var(--backdrop); }
  .sheet { padding: 26px; }
  .sheet > header { display: flex; align-items: center; margin-bottom: 18px; }
  .sheet h3 { flex: 1; margin: 0; font-size: 18px; font-weight: 700; }
  .dropzone { border: 2px dashed var(--strong-line); border-radius: 14px; padding: 30px 20px; text-align: center; transition: border-color .15s, background .15s; }
  body.dragging .dropzone { border-color: var(--accent); background: var(--accent-soft); }
  .dropzone p { margin: 0 0 4px; font-weight: 600; }
  .dropzone small { display: block; color: var(--faint); margin-bottom: 16px; }
  .or { display: flex; align-items: center; gap: 12px; color: var(--faint); font-size: 13px; margin: 18px 0; }
  .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .urlrow { display: flex; gap: 8px; }
  .urlrow input { flex: 1; min-width: 0; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--strong-line); background: var(--bg); outline: 0; font-size: 14px; }
  .urlrow input:focus { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .status { min-height: 20px; margin: 14px 0 0; font-size: 14px; color: var(--muted); }
  .status.error { color: var(--danger); }

  .tabs { display: flex; gap: 4px; flex: 1; }
  .tabs button { padding: 7px 14px; border-radius: 8px; font-size: 15px; font-weight: 600; color: var(--muted); }
  .tabs button.on { background: var(--accent-soft); color: var(--ink); }
  .field { display: flex; align-items: center; gap: 16px; padding: 14px 0; border-top: 1px solid var(--line); }
  .field:first-of-type { border-top: 0; }
  .field > span { flex: 1; font-size: 15px; font-weight: 500; }
  .field > span small { display: block; font-weight: 400; color: var(--muted); font-size: 13px; margin-top: 2px; }
  .choice { display: flex; gap: 4px; padding: 3px; border-radius: 10px; background: var(--soft); flex-wrap: wrap; }
  .choice button { padding: 6px 12px; border-radius: 8px; font-size: 13.5px; font-weight: 600; color: var(--muted); }
  .choice button.on { background: var(--surface); color: var(--accent); box-shadow: 0 1px 3px rgba(0,0,0,.18); }
  .swatches { display: flex; gap: 8px; }
  .swatches button { width: 26px; height: 26px; border-radius: 50%; }
  .swatches button.on { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent); }
  .about { text-align: center; padding: 6px 0 4px; }
  .about img { width: 84px; height: 84px; }
  .about h4 { margin: 10px 0 2px; font-size: 22px; font-weight: 700; }
  .about .version { color: var(--faint); font-size: 13px; }
  .about p { color: var(--muted); font-size: 14.5px; line-height: 1.55; margin: 14px auto; max-width: 400px; }
  .about dl { margin: 18px 0 0; text-align: left; font-size: 14px; }
  .about dl div { display: flex; gap: 14px; padding: 10px 0; border-top: 1px solid var(--line); }
  .about dt { color: var(--muted); width: 110px; flex: none; }
  .about dd { margin: 0; flex: 1; min-width: 0; overflow-wrap: anywhere; }

  .bookhead { display: flex; gap: 22px; margin-bottom: 18px; }
  .bookhead .cover { width: 132px; flex: none; }
  .bookhead .cover strong { font-size: 14px; }
  .bookhead h3 { font-family: var(--serif); font-size: 28px; font-weight: 500; letter-spacing: -.3px; line-height: 1.15; margin: 0 0 6px; overflow-wrap: anywhere; }
  .bookhead .by { color: var(--muted); font-size: 15px; margin-bottom: 10px; }
  .bookhead .facts { color: var(--faint); font-size: 13px; line-height: 1.6; margin-bottom: 16px; }
  .bookhead .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .bookhead .meta { flex: 1; min-width: 0; }
  .describe { font-family: var(--serif); font-size: 16.5px; line-height: 1.6; color: var(--text); margin: 0 0 18px; max-height: 150px; overflow-y: auto; }
  h5 { font-size: 13px; font-weight: 600; color: var(--faint); margin: 0 0 6px; letter-spacing: .2px; }
  .contents { max-height: 230px; overflow-y: auto; margin: 0 -8px; }
  .contents button { display: flex; gap: 12px; width: 100%; text-align: left; padding: 9px 8px; border-radius: 8px; font-size: 14px; }
  .contents button:hover { background: var(--accent-soft); }
  .contents i { font-style: normal; color: var(--faint); font-variant-numeric: tabular-nums; min-width: 24px; }
  .contents span { flex: 1; overflow-wrap: anywhere; }
  .contents small { color: var(--faint); font-size: 13px; white-space: nowrap; }
  .contents button.current span { font-weight: 600; color: var(--accent); }

  /* about a book: not a window in the middle but a panel that floats in from the left */
  #info-dialog { inset: 16px auto 16px 16px; margin: 0; width: min(460px, calc(100vw - 32px)); height: calc(100vh - 32px); max-height: none; animation: panel-in .22s ease-out; }
  #info-dialog .sheet { display: flex; flex-direction: column; min-height: 100%; }
  #info-dialog .bookhead .cover { width: 108px; }
  #info-dialog .bookhead h3 { font-size: 24px; }
  #info-dialog .describe { flex: none; }
  #info-dialog .contents { flex: 1 1 0; min-height: 150px; max-height: none; }
  @keyframes panel-in { from { opacity: 0; transform: translateX(-28px); } }
  @media (prefers-reduced-motion: reduce) { #info-dialog { animation: none; } }

  .options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .options button { text-align: left; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); min-width: 0; }
  .options button:hover { border-color: var(--strong-line); }
  .options button.on { border-color: var(--accent); background: var(--accent-soft); }
  .options b { display: block; font-size: 14.5px; }
  .options small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 2px; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; }
  .options.two { grid-template-columns: repeat(2, 1fr); }
  .options.two small { white-space: nowrap; }
  .check { display: flex; align-items: center; gap: 10px; font-size: 14px; margin-top: 12px; cursor: pointer; }
  .check input { width: 17px; height: 17px; accent-color: var(--accent); }
  .group { margin-bottom: 20px; }
  .progress { margin-top: 4px; }
  .progress .track { height: 6px; border-radius: 3px; }
  .progress .track i { transition: width .3s; border-radius: 3px; }
  .progress p { display: flex; justify-content: space-between; gap: 12px; margin: 10px 0 0; font-size: 14px; color: var(--muted); }
  .footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 22px; }

  /* reader */
  #reader { height: 100%; display: flex; flex-direction: column; }
  .rtop { display: flex; align-items: center; gap: 6px; padding: 10px 18px; color: var(--muted); font-size: 14px; }
  .rtop b { color: var(--ink); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 0 4px; }
  .rtop .by { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  #chapter-progress { height: 2px; background: var(--line); flex: none; }
  #chapter-progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s; }
  #page { flex: 1; overflow-y: auto; padding: 46px 24px 170px; }
  #text { max-width: 30em; margin: 0 auto; font-family: var(--serif); font-size: var(--reading-size); line-height: 1.7; color: var(--text); }
  #text .kicker { font-style: italic; font-size: .82em; color: var(--faint); margin: 0 0 6px; }
  #text h2 { font-size: 1.82em; line-height: 1.12; font-weight: 500; color: var(--ink); margin: 0 0 1.1em; letter-spacing: -.02em; overflow-wrap: anywhere; }
  #text p { margin: 0 0 1em; }
  #text span { border-radius: 4px; padding: 3px 2px; cursor: pointer; box-decoration-break: clone; -webkit-box-decoration-break: clone; transition: background .15s; }
  #text span:hover { background: var(--soft); }
  #text span.current { background: var(--accent-soft); color: var(--ink); }

  #player { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); display: flex; align-items: center; gap: 14px; padding: 10px 14px 10px 12px; border-radius: 999px; background: var(--surface); box-shadow: 0 14px 40px -10px var(--shade), 0 0 0 1px var(--line); }
  #play { width: 48px; height: 48px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }
  #play:hover { opacity: .88; }
  #player .mini { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); }
  #player .mini:hover { background: var(--accent-soft); color: var(--accent); }
  #player .sep { width: 1px; height: 24px; background: var(--line); }
  #time { font-size: 13px; color: var(--faint); font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 84px; text-align: center; }
  #speed { font-size: 14px; font-weight: 600; padding: 7px 12px; border-radius: 8px; background: var(--accent-soft); font-variant-numeric: tabular-nums; }
  #speed:hover { opacity: .8; }
  #speeds { position: fixed; bottom: 96px; left: 50%; background: var(--surface); border-radius: 14px; padding: 6px; box-shadow: 0 14px 40px -10px var(--shade), 0 0 0 1px var(--line); display: flex; flex-direction: column; min-width: 150px; }
  #speeds button { display: flex; justify-content: space-between; gap: 18px; padding: 9px 12px; border-radius: 8px; font-size: 14px; text-align: left; }
  #speeds button:hover { background: var(--accent-soft); }
  #speeds button.on { font-weight: 700; color: var(--accent); }
  #speeds small { color: var(--faint); font-weight: 400; }

  #chapters { position: fixed; top: 0; right: 0; bottom: 0; width: min(340px, 100vw); background: var(--surface); box-shadow: -20px 0 60px -20px var(--shade), 0 0 0 1px var(--line); display: flex; flex-direction: column; transform: translateX(105%); visibility: hidden; transition: transform .2s, visibility .2s; z-index: 5; }
  #chapters.open { transform: none; visibility: visible; }
  #chapters header { display: flex; align-items: center; padding: 14px 14px 10px 22px; }
  #chapters h3 { flex: 1; margin: 0; font-size: 16px; font-weight: 700; }
  #chapter-list { overflow-y: auto; padding: 0 10px 20px; }
  #chapter-list button { display: flex; gap: 12px; width: 100%; text-align: left; padding: 10px 12px; border-radius: 10px; font-size: 14px; color: var(--muted); }
  #chapter-list button:hover { background: var(--accent-soft); }
  #chapter-list button.current { color: var(--ink); font-weight: 600; background: var(--accent-soft); }
  #chapter-list i { font-style: normal; color: var(--faint); font-variant-numeric: tabular-nums; min-width: 22px; }
  #chapter-list span { overflow-wrap: anywhere; }

  #toast { position: fixed; left: 50%; top: 20px; transform: translateX(-50%); background: var(--ink); color: var(--on-ink); padding: 10px 18px; border-radius: 10px; font-size: 14px; z-index: 60; }

  /* onboarding: a veil with a hole around what is being shown, a hand-written note and a dashed arrow */
  #tour { position: fixed; inset: 0; z-index: 50; pointer-events: none; }   /* what it points at stays clickable */
  #tour > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  #tour .veil { fill: var(--veil); }
  #tour .arrow { fill: none; stroke: var(--ink); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  #tour .dashes { stroke-dasharray: 9 10; animation: tour-march 1.1s linear infinite; }
  #tour .reveal { stroke: #fff; stroke-width: 12; animation: tour-draw .9s cubic-bezier(.6,0,.3,1) both; }
  #tour .head { opacity: 0; animation: tour-pop .25s ease-out .8s both; }
  @keyframes tour-march { to { stroke-dashoffset: -19; } }
  @keyframes tour-draw { from { stroke-dashoffset: var(--length); } to { stroke-dashoffset: 0; } }
  @keyframes tour-pop { from { opacity: 0; } to { opacity: 1; } }
  #tour-note { position: absolute; width: 300px; pointer-events: auto; animation: tour-note .45s ease-out both; }
  /* a soft patch of background behind the note, so it reads over whatever is underneath */
  #tour-note:not(.center)::before { content: ""; position: absolute; inset: -34px -44px; z-index: -1; background: radial-gradient(closest-side, var(--bg) 62%, transparent); }
  @keyframes tour-note { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  #tour-note p { margin: 0 0 12px; font-family: Caveat, "Segoe Print", "Bradley Hand", cursive; font-size: 31px; font-weight: 600; line-height: 1.12; color: var(--ink); }
  #tour-note .row { display: flex; align-items: center; gap: 14px; }
  #tour-note .skip { font-size: 13px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
  #tour-note .sound { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); }
  #tour-note .sound:hover { background: var(--accent-soft); color: var(--accent); }
  #tour-note .dots { margin-left: auto; display: flex; gap: 5px; }
  #tour-note .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--strong-line); }
  #tour-note .dots i.on { background: var(--accent); }
  #tour-note.center { text-align: center; width: min(460px, calc(100vw - 40px)); }
  #tour-note.center p { font-size: 44px; margin-bottom: 6px; }
  #tour-note.center span { display: block; font-size: 16px; color: var(--muted); margin-bottom: 22px; line-height: 1.5; }
  #tour-note.center .row { justify-content: center; }
  @media (prefers-reduced-motion: reduce) { #tour .dashes, #tour .reveal, #tour .head, #tour-note { animation: none; opacity: 1; } }

  /* inside the desktop window, whose header bar has the title and these buttons */
  .shell .top, .shell .rtop { display: none; }
  .shell .top.searching { display: flex; justify-content: center; }
  .shell .top.searching > :not(.search) { display: none; }
  .shell .search { width: min(420px, 100%); }
  .shell #library { padding-top: 6px; }
  .shell #resume-box h2.section, .shell #shelf > h2.section:first-child { margin-top: 20px; }

  @media (max-width: 720px) {
    #library { padding: 16px 18px 60px; }
    .top { flex-wrap: wrap; }
    .search { order: 3; width: 100%; }
    .resume { padding-right: 18px; gap: 14px; }
    .resume .cover { width: 60px; }
    .resume h3 { font-size: 21px; }
    #page { padding: 28px 18px 160px; }
    #player { gap: 8px; bottom: 16px; }
    .rtop .by { display: none; }
    .rtop b { flex: 1; }
    .bookhead { flex-direction: column; }
    .options { grid-template-columns: repeat(2, 1fr); }

function applySettings() {
  const dark = settings.theme === "dark" || (settings.theme === "system" && darkQuery.matches);
  const root = document.documentElement;
  root.dataset.theme = dark ? "dark" : "light";
  const [light, lightSoft, night, nightSoft] = ACCENTS[settings.accent] || ACCENTS.blue;
  root.style.setProperty("--accent", dark ? night : light);
  root.style.setProperty("--accent-soft", dark ? nightSoft : lightSoft);
  root.style.setProperty("--on-accent", dark ? "#131316" : "#ffffff");   // the night accents are light, the day ones dark
  root.style.setProperty("--reading-size", `${SIZES[settings.size] || SIZES.medium}px`);
  tell({theme: dark ? "dark" : "light", accent: dark ? night : light});
}
function saveSettings() {
  try { localStorage.setItem("settings", JSON.stringify(settings)); } catch {}
  applySettings();
}
darkQuery.addEventListener("change", applySettings);
if (shell) document.documentElement.classList.add("shell");
applySettings();

/* words: the voice speaks Turkish only, and so does the app */

const lang = "tr";
const WORDS = {

  settings: "Ayarlar", about: "Hakkında", theme: "Tema", light: "Açık", dark: "Koyu", system: "Sistem", accent: "Vurgu rengi",
  accents: {blue: "Mavi", violet: "Mor", green: "Yeşil", orange: "Turuncu", rose: "Pembe", graphite: "Grafit"},
  textSize: "Yazı boyutu", sizes: {small: "Küçük", medium: "Orta", large: "Büyük", huge: "Çok büyük"},
  tourAgain: "Tanıtım", tourAgainHint: "Uygulamanın nasıl kullanıldığını yeniden göster", show: "Göster",
  aboutText: "EMA Reader, kitapları ve makaleleri sana Türkçe sesli okuyan açık kaynaklı bir uygulamadır. Her şey kendi bilgisayarında çalışır; okudukların hiçbir yere gönderilmez.",
  madeBy: "Geliştiren", voice: "Ses modeli", source: "Kaynak kod", notice: "Not", noticeText: "Duyduğun ses yapay zekâ ile üretilmiştir.",

  updates: "Güncellemeleri denetle", updatesHint: "Açılışta yeni bir sürüm çıkmış mı diye GitHub'a bakar", on: "Açık", off: "Kapalı",
  updateFound: v => `EMA Reader ${v} yayınlandı.`, updateSee: "Güncelle", updateLater: "Şimdi değil",
  updateTitle: v => `Yeni sürüm: ${v}`, whatsNew: "Yenilikler", noNotes: "Bu sürüm için not yazılmamış.",
  updateDownload: "İndir ve kur", updatePage: "Sürüm sayfası",
  updateHowInstaller: v => `Sende ${v} sürümü var. İndirdiğin dosyayı açıp kur; kitaplığın ve ayarların yerinde kalır.`,
  updateHowSource: v => `Sende ${v} sürümü var. Güncellemek için uygulamanın klasöründe şunu çalıştır, sonra uygulamayı yeniden aç:`,
  upToDate: " · güncel", newerVersion: v => `${v} sürümü çıktı`,
  addFailed: "Eklenemedi.",
  tourWelcome: "Hoş geldin!", tourIntro: "EMA Reader kitapları ve makaleleri sana Türkçe okur. Nasıl çalıştığını yarım dakikada gösterelim.",
  tourStart: "Göster", tourNext: "İleri", tourDone: "Başlayalım", tourSkip: "Geç", tourMute: "Sesli anlatımı kapat", tourUnmute: "Sesli anlatımı aç",

const t = (key, ...args) => typeof WORDS[key] === "function" ? WORDS[key](...args) : WORDS[key];
document.querySelectorAll("[data-t]").forEach(node => node.textContent = t(node.dataset.t));
document.querySelectorAll("[data-label]").forEach(node => { node.setAttribute("aria-label", t(node.dataset.label)); node.title = t(node.dataset.label); });
document.querySelectorAll("[data-placeholder]").forEach(node => { node.placeholder = t(node.dataset.placeholder); node.setAttribute("aria-label", node.placeholder); });
document.querySelectorAll("[data-title]").forEach(node => node.title = t(node.dataset.title));

/* the desktop window: it shows the title and the buttons, the page tells it what is on screen */

let searching = false;
function tellShell() {
  tell(book
    ? {view: "reader", title: book.title, subtitle: book.author || "", chapters: book.chapters.length > 1}
    : {view: "library", empty: books.length === 0});
}
let shellReply = null;
window.shellAnswer = value => shellReply?.(value);
function askShell(question) {   // where is one of the window's own buttons?
  return new Promise(resolve => {
    shellReply = resolve;
    tell({ask: question});
    setTimeout(() => resolve(null), 400);
  });
}
window.shellAction = name => ({
  back: () => showLibrary(),
  add: () => openAdd(),
  chapters: () => $("chapters").classList.toggle("open"),
  download: () => openDownload(book),
  info: () => openInfo(book.id),
  settings: () => openSettings(),
  search: () => { searching = !searching; if (!searching) $("search").value = ""; renderLibrary(); if (searching) $("search").focus(); },

document.addEventListener("click", e => {
  const link = e.target.closest("a[href^='http']");
  if (link && shell) { e.preventDefault(); tell({open: link.href}); }
});

/* state */

const COVERS = ["#1f3a5f", "#8c2f39", "#2f5d50", "#b5852f", "#3b3355", "#7a4b2a", "#245a6b", "#5a2d4f"];

let books = [];         // the library
let book = null;        // the open book
let chapter = 0;        // index of the open chapter
let sentences = [];     // the chapter's sentences: {text, el, endsParagraph, before}
let index = 0;          // the sentence being read
let playing = false;
let run = 0;            // bumped whenever playback is restarted, so stale loops stop
let loaded = null;      // cache key of the audio currently in the <audio> element

let speed = 1;
try { speed = Number(localStorage.getItem("speed")) || 1; } catch {}

// how fast the voice really reads, measured from the sentences that have been played; times are estimated from it
const pace = {chars: 0, seconds: 0};
try {
  const kept = JSON.parse(localStorage.getItem("pace") || "{}");
  if (kept.chars > 0 && kept.seconds > 0) Object.assign(pace, {chars: kept.chars, seconds: kept.seconds});
} catch {}
const charsPerSecond = () => (pace.chars + FIRST_PACE * PACE_TRUST) / (pace.seconds + PACE_TRUST);
function learnPace(chars, seconds) {
  if (!Number.isFinite(seconds) || seconds < 0.3) return;
  pace.chars += chars; pace.seconds += seconds * speed;
  if (pace.seconds > 1800) { pace.chars /= 2; pace.seconds /= 2; }   // recent listening counts for more
  try { localStorage.setItem("pace", JSON.stringify(pace)); } catch {}
}

async function api(path, options) {
  const response = await fetch(path, options);
  const data = await response.json();
  if (!response.ok) throw Object.assign(new Error(data.error || "request failed"), {told: Boolean(data.error)});   // told: the server explained it
  return data;
}

function duration(seconds) {
  const minutes = Math.max(1, Math.round(seconds / 60));
  return minutes < 60 ? t("minutes", minutes) : t("hours", Math.floor(minutes / 60), minutes % 60);
}

function clock(seconds) {
  seconds = Math.round(seconds);
  const h = Math.floor(seconds / 3600), m = Math.floor(seconds / 60) % 60, s = String(seconds % 60).padStart(2, "0");
  return h ? `${h}:${String(m).padStart(2, "0")}:${s}` : `${m}:${s}`;
}

let toastTimer;
function toast(message) {
  $("toast").textContent = message; $("toast").hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => $("toast").hidden = true, 4000);
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text != null) node.textContent = text;
  return node;
}
function icon(name, size = 16) {
  const holder = el("span");
  holder.innerHTML = `<svg width="${size}" height="${size}"><use href="#i-${name}"/></svg>`;
  return holder.firstChild;
}

// every dialog closes from its × and from a click outside it
document.querySelectorAll("dialog").forEach(dialog => {
  dialog.querySelectorAll("[data-close]").forEach(b => b.onclick = () => dialog.close());
  dialog.addEventListener("click", e => { if (e.target === dialog) dialog.close(); });
});
const chapterTitle = (b, n) => b.chapters[n].title || t("chapterN", n + 1);

/* library */

function cover(b) {
  const box = el("div", "cover" + (b.article ? " article" : ""));
  if (!b.article) {
    let hash = 0;
    for (const ch of b.title) hash = (hash * 31 + ch.codePointAt(0)) >>> 0;
    box.style.background = COVERS[hash % COVERS.length];
  }
  box.append(el("strong", "", b.title), el("small", "", b.author || ""));
  if (b.cover) {   // the book's own picture, over the drawn one in case it fails to load
    const picture = el("img"); picture.alt = ""; picture.loading = "lazy"; picture.src = `/api/books/${b.id}/cover`;
    picture.onerror = () => picture.remove();
    box.append(picture);
  }
  return box;
}

const isFinished = b => b.done >= b.size;
const remaining = b => duration((b.size - b.done) / charsPerSecond() / speed);

function statusOf(b) {
  if (isFinished(b)) return t("finished");
  if (b.done === 0) return b.article ? `${t("article")} · ${remaining(b)}` : t("fresh");
  return t("percent", Math.round(100 * b.done / b.size));
}

function card(b) {
  const item = el("div", "item"); item.tabIndex = 0;
  const more = el("button", "more"); more.append(icon("info", 18));
  more.title = t("aboutBook"); more.setAttribute("aria-label", `${t("aboutBook")}: ${b.title}`);
  more.onclick = e => { e.stopPropagation(); openInfo(b.id); };
  item.append(cover(b), el("h4", "", b.title), el("span", "", statusOf(b)), more);
  item.onclick = () => openBook(b.id);
  item.onkeydown = e => { if (e.key === "Enter" && e.target === item) openBook(b.id); };
  return item;
}

function renderLibrary() {
  const empty = books.length === 0;
  $("welcome").hidden = !empty; $("shelf").hidden = empty; $("add").hidden = empty;
  $("search-box").hidden = empty || (shell && !searching);
  $("top").classList.toggle("searching", searching);
  tellShell();

  const query = $("search").value.trim().toLocaleLowerCase("tr");
  const shown = books.filter(b => `${b.title} ${b.author || ""}`.toLocaleLowerCase("tr").includes(query));
  $("books").replaceChildren(...shown.map(card));
  $("no-match").hidden = shown.length > 0;

  const last = books.filter(b => b.opened && b.done > 0 && !isFinished(b)).sort((x, y) => y.opened - x.opened)[0];
  $("resume-box").hidden = !last || Boolean(query);
  if (!last) return;
  const info = el("div", "info");
  const track = el("div", "track"); track.innerHTML = `<i style="width:${100 * last.done / last.size}%"></i>`;
  const where = [last.author, last.chapters > 1 && t("chapterN", last.chapter + 1), t("left", remaining(last))].filter(Boolean).join(" · ");
  info.append(el("h3", "", last.title), el("p", "", where), track);
  const go = el("button", "go"); go.append(icon("play", 24));
  go.title = t("resume"); go.setAttribute("aria-label", t("resume"));
  $("resume").replaceChildren(cover(last), info, go);
  $("resume").onclick = () => openBook(last.id, true);
  $("resume").onkeydown = e => { if (e.key === "Enter") openBook(last.id, true); };
}

async function showLibrary() {
  stop();
  book = null;
  clearTimeout(saveTimer);
  await pendingSave?.();   // so the library shows the position just left
  $("reader").hidden = true; $("library").hidden = false;
  $("chapters").classList.remove("open"); $("speeds").hidden = true;
  document.title = "EMA Reader";
  books = await api("/api/books");
  renderLibrary();
}

$("search").oninput = renderLibrary;

$("add").onclick = openAdd; $("add-first").onclick = openAdd;

function status(message, error = false) {

  document.body.classList.add("dragging");

});

  e.preventDefault(); document.body.classList.remove("dragging");
  if (!book && e.dataTransfer.files[0]) addFile(e.dataTransfer.files[0]);
});

/* about a book: its cover, description and contents */

async function openInfo(id) {
  const b = book?.id === id ? book : await api(`/api/books/${id}`);
  const about = b.about || {};
  const sizes = b.chapters.map(c => c.paragraphs.reduce((sum, p) => sum + p.reduce((n, s) => n + s.length, 0), 0));
  const total = sizes.reduce((sum, n) => sum + n, 0);
  const started = b.progress.chapter > 0 || b.progress.sentence > 0;

  $("info-cover").replaceChildren(cover({id, title: b.title, author: b.author, cover: Boolean(b.cover), article: /^https?:/.test(b.source)}));
  $("info-title").textContent = b.title;
  $("info-author").textContent = b.author || "";
  const published = [about.publisher, (about.date || "").slice(0, 4)].filter(Boolean).join(", ");
  const facts = [published, `${t("chapterCount", b.chapters.length)}, ${t("listening", duration(total / charsPerSecond() / speed))}`,
                 t("added", new Date(b.added * 1000).toLocaleDateString(lang))].filter(Boolean);
  $("info-facts").replaceChildren(...facts.flatMap((line, i) => i ? [el("br"), line] : [line]));
  $("info-description").textContent = about.description || ""; $("info-description").hidden = !about.description;

  const open = (number, sentence, start) => {
    $("info-dialog").close();
    if (book?.id === id) openChapter(number, sentence, start); else openBook(id, start, number, sentence);
  };
  $("info-listen").lastElementChild.textContent = t(started ? "resume" : "listen");
  $("info-listen").onclick = () => open(b.progress.chapter, b.progress.sentence, true);
  $("info-download").onclick = () => { $("info-dialog").close(); openDownload(b); };
  const remove = $("info-remove"); remove.textContent = t("remove"); remove.dataset.armed = "";
  remove.onclick = async () => {
    if (!remove.dataset.armed) { remove.dataset.armed = "1"; remove.textContent = t("confirmRemove"); return; }
    await api(`/api/books/${id}`, {method: "DELETE"});
    $("info-dialog").close();
    showLibrary();
  };
  $("info-contents").replaceChildren(...b.chapters.map((c, i) => {
    const row = el("button", i === b.progress.chapter && started ? "current" : "");
    row.append(el("i", "", i + 1), el("span", "", chapterTitle(b, i)), el("small", "", duration(sizes[i] / charsPerSecond() / speed)));
    row.onclick = () => open(i, 0, false);
    return row;
  }));
  $("info-dialog").showModal();
}

/* downloading: a chapter or the whole book, as audio or text */

const FORMATS = ["mp3", "ogg", "opus", "flac", "wav", "txt"];
const download = {book: null, chapter: 0, scope: "chapter", format: "mp3", job: null, timer: null};

function pick(container, values, current, label, choose) {
  $(container).replaceChildren(...values.map(value => {
    const b = el("button", value === current ? "on" : "");
    const text = label(value);
    if (Array.isArray(text)) b.append(el("b", "", text[0]), el("small", "", text[1])); else b.textContent = text;
    b.onclick = () => choose(value);
    return b;
  }));
}

function drawDownload() {
  const many = download.book.chapters.length > 1;
  $("scope-group").hidden = !many;
  if (!many) download.scope = "book";
  pick("set-scope", ["chapter", "book"], download.scope,
       v => v === "chapter" ? [t("thisChapter"), chapterTitle(download.book, download.chapter)] : [t("wholeBook"), t("chapterCount", download.book.chapters.length)],
       v => { download.scope = v; drawDownload(); });
  $("split-row").hidden = download.scope !== "book" || !many;
  pick("set-format", FORMATS, download.format, v => t("fmt")[v], v => { download.format = v; drawDownload(); });
}

function openDownload(b) {
  Object.assign(download, {book: b, chapter: book?.id === b.id ? chapter : b.progress.chapter, job: null});
  $("download-form").hidden = false; $("download-progress").hidden = true; $("download-status").textContent = "";
  drawDownload();
  $("download-dialog").showModal();
}

$("start-download").onclick = async () => {
  const {book: b, scope, format} = download;
  $("download-form").hidden = true; $("download-progress").hidden = false; $("download-status").textContent = "";
  $("download-bar").style.width = "0"; $("download-percent").textContent = ""; $("download-label").textContent = t("preparing");
  try {
    const split = scope === "book" && $("split").checked && b.chapters.length > 1;
    const {job} = await api(`/api/books/${b.id}/export`, {method: "POST", body: JSON.stringify({scope, chapter: download.chapter, format, split, speed})});
    download.job = job;
    while (download.job === job) {
      const state = await api(`/api/exports/${job}`);
      if (download.job !== job) return;
      $("download-bar").style.width = `${100 * state.progress}%`;
      $("download-percent").textContent = t("percent", Math.round(100 * state.progress));
      $("download-label").textContent = state.name;
      if (state.state === "working") { await wait(400); continue; }
      download.job = null;
      if (state.state !== "ready") throw new Error(state.error || "failed");
      location.href = `/api/exports/${job}/file`;   // an attachment: the page stays where it is
      $("download-dialog").close();
      if (!shell) toast(t("downloaded"));
    }
  } catch (e) {
    download.job = null;
    $("download-form").hidden = false; $("download-progress").hidden = true;
    $("download-status").textContent = t("downloadFailed"); $("download-status").className = "status error";
  }
};
$("cancel-download").onclick = () => $("download-dialog").close();
$("download-dialog").addEventListener("close", () => {
  if (download.job) fetch(`/api/exports/${download.job}`, {method: "DELETE"});
  download.job = null;
});

/* reader */

async function openBook(id, start = false, number = null, sentence = null) {
  book = await api(`/api/books/${id}`);
  $("library").hidden = true; $("reader").hidden = false;
  $("book-title").textContent = book.title; $("book-author").textContent = book.author || "";
  document.title = `${book.title} · EMA Reader`;
  tellShell();
  $("open-chapters").hidden = book.chapters.length < 2;
  $("chapter-list").replaceChildren(...book.chapters.map((c, i) => {
    const b = el("button");
    b.append(el("i", "", i + 1), el("span", "", chapterTitle(book, i)));
    b.onclick = () => { $("chapters").classList.remove("open"); openChapter(i, 0, playing); };
    return b;
  }));
  openChapter(number ?? book.progress.chapter, sentence ?? book.progress.sentence, start);
}

function openChapter(number, sentence, keepPlaying) {
  stop();
  chapter = number;
  sentences = [];
  let before = 0;
  const nodes = [];
  if (book.chapters.length > 1) nodes.push(el("p", "kicker", t("chapterOf", chapter + 1, book.chapters.length)));
  nodes.push(el("h2", "", chapterTitle(book, chapter)));
  for (const parts of book.chapters[chapter].paragraphs) {
    const p = el("p");
    parts.forEach((text, i) => {
      const span = el("span", "", text);
      const at = sentences.length;
      span.onclick = () => jump(at, true);
      sentences.push({text, el: span, endsParagraph: i === parts.length - 1, before});
      before += text.length;
      p.append(span, " ");
    });
    nodes.push(p);
  }
  sentences.total = before;
  layTimeline();
  $("text").replaceChildren(...nodes);
  [...$("chapter-list").children].forEach((b, i) => b.classList.toggle("current", i === chapter));
  $("page").scrollTop = 0;
  select(Math.min(sentence, sentences.length - 1), sentence >= sentences.length);
  if (keepPlaying) play();
}

// when each sentence starts and how long it lasts, in seconds; laid out once for a chapter and a speed,
// so the clock does not shift while the pace is still being measured
function layTimeline() {
  const rate = charsPerSecond() * speed;
  let at = 0;
  sentences.forEach((s, i) => {
    s.at = at; s.lasts = s.text.length / rate;
    at += s.lasts + (i < sentences.length - 1 ? (s.endsParagraph ? PARAGRAPH_PAUSE : SENTENCE_PAUSE) / 1000 : 0);
  });
  sentences.seconds = at;
}

let heard = 0;   // how much of the current sentence has been spoken, from 0 to 1
function showTime() {
  const current = sentences[index];
  $("time").textContent = `${clock(current.at + heard * current.lasts)} / ${clock(sentences.seconds)}`;
}
audio.addEventListener("timeupdate", () => {   // the clock runs with the voice instead of jumping from sentence to sentence
  if (!book || loaded !== clipKey(index) || !(audio.duration > 0)) return;
  heard = Math.min(1, audio.currentTime / audio.duration);
  showTime();
});

function select(i, finished = false) {
  sentences[index]?.el.classList.remove("current");
  index = i;
  heard = finished ? 1 : 0;
  const current = sentences[index];
  current.el.classList.add("current");
  const box = current.el.getBoundingClientRect(), page = $("page").getBoundingClientRect();
  if (box.top < page.top + 40 || box.bottom > page.bottom - 190) {
    $("page").scrollTo({top: $("page").scrollTop + box.top - page.top - page.height / 3, behavior: "smooth"});
  }
  $("chapter-progress").firstElementChild.style.width = `${100 * (current.before + (finished ? current.text.length : 0)) / sentences.total}%`;
  showTime();
  saveProgress(finished);
}

let saveTimer, pendingSave = null;
function saveProgress(finished = false) {
  clearTimeout(saveTimer);
  // one past the last sentence marks the book as finished
  const id = book.id, body = JSON.stringify({chapter, sentence: finished ? sentences.length : index});
  pendingSave = () => { pendingSave = null; return fetch(`/api/books/${id}/progress`, {method: "PUT", body, keepalive: true}); };
  saveTimer = setTimeout(() => pendingSave?.(), 600);
}

/* playback: one request per sentence, the next few fetched ahead */

function speech(text, rate) {
  return fetch("/tts", {method: "POST", body: JSON.stringify({text, speed: rate})})
    .then(r => { if (!r.ok) throw new Error("no audio"); return r.blob(); })
    .then(blob => URL.createObjectURL(blob));
}

const clipKey = i => `${book.id}:${chapter}:${i}:${speed}`;
function clip(i) {
  const key = clipKey(i);
  if (!cache.has(key)) {
    const url = speech(sentences[i].text, speed);
    url.catch(() => cache.delete(key));
    cache.set(key, url);
    if (cache.size > CACHE_LIMIT) {
      const [oldest, stale] = cache.entries().next().value;
      cache.delete(oldest);
      if (oldest !== loaded) stale.then(URL.revokeObjectURL, () => {});
    }
  }
  return {key, url: cache.get(key)};
}

const ended = () => new Promise(resolve => audio.addEventListener("ended", resolve, {once: true}));
const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

async function play() {
  if (!book) return;
  hush();   // the spoken tour gives way to the book
  const mine = ++run;
  setPlaying(true);
  try {
    while (mine === run) {
      for (let i = 1; i <= PREFETCH && index + i < sentences.length; i++) clip(index + i);
      const {key, url} = clip(index);
      const src = await url;
      if (mine !== run) return;
      if (loaded !== key) { audio.src = src; loaded = key; }   // otherwise resume where it was paused
      const done = ended();
      await audio.play();
      await done;
      if (mine !== run) return;
      learnPace(sentences[index].text.length, audio.duration);
      loaded = null;
      await wait(sentences[index].endsParagraph ? PARAGRAPH_PAUSE : SENTENCE_PAUSE);
      if (mine !== run) return;
      if (index + 1 < sentences.length) select(index + 1);
      else if (chapter + 1 < book.chapters.length) return openChapter(chapter + 1, 0, true);
      else { select(index, true); break; }
    }
  } catch (e) {
    if (mine !== run) return;   // interrupted on purpose
    toast(t("audioFailed"));
  }
  if (mine === run) setPlaying(false);
}

function pause() {
  run++;
  audio.pause();
  setPlaying(false);
}

function stop() {
  pause();
  loaded = null;
}

function setPlaying(value) {
  playing = value;
  $("play-icon").setAttribute("href", value ? "#i-pause" : "#i-play");
  $("play").setAttribute("aria-label", t(value ? "pause" : "play")); $("play").title = t(value ? "pause" : "play");
  if ("mediaSession" in navigator) navigator.mediaSession.playbackState = value ? "playing" : "paused";
}

function jump(i, start = playing) {
  if (i < 0 || i >= sentences.length) return;
  stop();
  select(i);
  if (start) play();
}

const toggle = () => playing ? pause() : play();
$("play").onclick = toggle;
$("prev").onclick = () => jump(index - 1);
$("next").onclick = () => jump(index + 1);
$("back").onclick = () => showLibrary();
$("open-chapters").onclick = () => $("chapters").classList.toggle("open");
$("close-chapters").onclick = () => $("chapters").classList.remove("open");
$("open-download").onclick = () => openDownload(book);
$("open-info").onclick = () => openInfo(book.id);

/* speed */

const speedLabel = value => value.toLocaleString(lang, {minimumFractionDigits: 1, maximumFractionDigits: 2}) + "×";
function showSpeed() {
  $("speed").textContent = speedLabel(speed);
  $("speeds").replaceChildren(...SPEEDS.map(([value, name]) => {
    const b = el("button", value === speed ? "on" : "");
    b.append(speedLabel(value), el("small", "", name ? t(name) : ""));
    b.onclick = () => setSpeed(value);
    return b;
  }));
}
function setSpeed(value) {
  speed = value;
  try { localStorage.setItem("speed", speed); } catch {}
  $("speeds").hidden = true;
  layTimeline(); heard = 0;
  showSpeed(); showTime();
  if (playing) jump(index, true);   // re-read the current sentence at the new speed
  else loaded = null;
}
$("speed").onclick = e => {
  e.stopPropagation();
  $("speeds").hidden = !$("speeds").hidden;
  const box = $("speed").getBoundingClientRect();
  $("speeds").style.left = `${Math.max(8, box.right - $("speeds").offsetWidth)}px`;
};
document.addEventListener("click", e => {
  if (!e.target.closest("#speeds")) $("speeds").hidden = true;
  if (!e.target.closest("#chapters, #open-chapters")) $("chapters").classList.remove("open");
});
showSpeed();

document.addEventListener("keydown", e => {
  if (e.key === "Escape") { $("speeds").hidden = true; $("chapters").classList.remove("open"); }
  if (!book || document.querySelector("dialog[open]") || tour.step >= 0 || e.target.matches("input")) return;
  if (e.key === " " && e.target.matches("button")) return;   // the focused button handles it
  if (e.key === " ") { e.preventDefault(); toggle(); }
  else if (e.key === "ArrowRight") jump(index + 1);
  else if (e.key === "ArrowLeft") jump(index - 1);
});

if ("mediaSession" in navigator) {
  navigator.mediaSession.setActionHandler("play", play);
  navigator.mediaSession.setActionHandler("pause", pause);
  navigator.mediaSession.setActionHandler("nexttrack", () => jump(index + 1));
  navigator.mediaSession.setActionHandler("previoustrack", () => jump(index - 1));
}

/* onboarding: shown once, on a short welcome text that is added to the library, and read aloud */

const WELCOME_NAME = "EMA Reader'a hoş geldin.md";
const WELCOME_TEXT = `# Hoş geldin

EMA Reader'a hoş geldin. Bu kısa metin, uygulamayı denemen için burada. Alttaki oynat düğmesine bastığında bu satırları sana yüksek sesle okurum.

Okuduğum cümle her zaman işaretlenir, böylece gözünle de takip edebilirsin. Başka bir yerden devam etmek istersen o cümleye tıklaman yeterli.

# Kendi kitapların

Kitaplığına EPUB, PDF ya da düz metin dosyaları ekleyebilirsin. İnternetteki bir yazıyı dinlemek istersen adresini yapıştırman yeter.

Nerede kaldığını ben hatırlarım. Uygulamayı kapatıp yarın açtığında kaldığın cümleden devam ederiz. İyi dinlemeler!`;

// what the guide says aloud at each step; a little fuller than the note on screen
const SPOKEN = {
  welcome: "Hoş geldin! Ben EMA. Kitapları ve makaleleri sana sesli okurum. Nasıl çalıştığımı yarım dakikada göstereyim.",
  tourPlay: "Dinlemek için bu düğmeye bas. Durdurmak için bir daha basman yeterli.",
  tourSentence: "Okuduğum cümle işaretlenir. Başka bir cümleye tıklarsan oradan devam ederim.",
  tourSpeed: "Çok hızlı ya da çok yavaş okuyorsam, hızımı buradan ayarlayabilirsin.",
  tourAdd: "Kendi kitabını ya da internetteki bir yazıyı buradan ekleyebilirsin. Hazırsan başlayalım!",
};
const guide = new Audio();
let guideOn = true, guideTurn = 0;
try { guideOn = localStorage.getItem("guide") !== "off"; } catch {}
function hush() { guideTurn++; guide.pause(); }
async function say(key) {
  hush();
  const mine = guideTurn;
  if (!guideOn || playing) return;
  try {
    const src = await speech(SPOKEN[key], 1);
    if (mine !== guideTurn) return;
    guide.src = src;
    await guide.play();   // a browser may refuse sound before the first click; the notes still show
  } catch {}
}

const tour = {
  step: -1,
  steps: [
    {center: true, speak: "welcome"},
    {target: () => $("play"), text: "tourPlay", from: [-250, -190], bend: 70,
     before: async () => { await openWelcome(); }},
    // the first line of a sentence, so the hole is one tidy strip
    {target: () => sentences[2].el.getClientRects()[0], text: "tourSentence", from: [150, 250], bend: -90, pad: 5},
    {target: () => $("speed"), text: "tourSpeed", from: [170, -200], bend: -70},
    // inside the desktop window the add button is in the header bar, just above the page
    {target: async () => {
       if (!shell) return $("add").getBoundingClientRect();
       const box = await askShell("add") || {left: 6, right: 40};
       return {left: box.left, right: box.right, top: -34, bottom: -4};
     },
     text: "tourAdd", from: () => shell ? [230, 240] : [-330, 170], bend: 80, last: true,
     before: async () => { await showLibrary(); tell({highlight: "add"}); }},
  ],
};

async function openWelcome() {
  let welcome = books.find(b => b.title === WELCOME_NAME.replace(/\.md$/, ""));
  if (!welcome) welcome = await api(`/api/books?name=${encodeURIComponent(WELCOME_NAME)}`, {method: "POST", body: WELCOME_TEXT});
  await openBook(welcome.id, false, 0, 0);
}

function tourButton(label, primary, action) {
  const b = el("button", primary ? "btn" : "skip", t(label));
  b.onclick = action;
  return b;
}

function soundButton() {
  const b = el("button", "sound");
  const draw = () => {
    b.replaceChildren(icon(guideOn ? "sound" : "mute", 20));
    b.title = t(guideOn ? "tourMute" : "tourUnmute"); b.setAttribute("aria-label", b.title);
  };
  b.onclick = () => {
    guideOn = !guideOn;
    try { localStorage.setItem("guide", guideOn ? "on" : "off"); } catch {}
    draw();
    if (guideOn) say(tour.steps[tour.step].speak || tour.steps[tour.step].text); else hush();
  };
  draw();
  return b;
}

async function showStep(number) {
  const step = tour.steps[number];
  document.querySelectorAll("dialog[open]").forEach(d => d.close());
  tour.step = number;
  if (step.before) await step.before();
  $("tour").hidden = false;
  await drawStep();
  say(step.speak || step.text);
}

async function drawStep() {
  const step = tour.steps[tour.step];
  const note = $("tour-note");
  const text = el("p");
  const row = el("div", "row");
  note.className = step.center ? "center" : "";
  note.style.animation = "none"; note.offsetWidth; note.style.animation = "";   // replay the entrance

  if (step.center) {
    text.textContent = t("tourWelcome");
    row.append(tourButton("tourStart", true, () => showStep(1)), tourButton("tourSkip", false, endTour), soundButton());
    note.replaceChildren(text, el("span", "", t("tourIntro")), row);
    note.style.left = `${(innerWidth - note.offsetWidth) / 2}px`; note.style.top = `${(innerHeight - note.offsetHeight) / 2}px`;
    for (const id of ["tour-path", "tour-mask", "tour-head"]) $(id).setAttribute("d", "");
    $("tour-cut").setAttribute("width", 0);
    return;
  }

  text.textContent = t(step.text);
  const dots = el("div", "dots");
  tour.steps.slice(1).forEach((_, i) => dots.append(el("i", i === tour.step - 1 ? "on" : "")));
  row.append(tourButton(step.last ? "tourDone" : "tourNext", true, () => step.last ? endTour() : showStep(tour.step + 1)));
  if (!step.last) row.append(tourButton("tourSkip", false, endTour));
  row.append(soundButton(), dots);
  note.replaceChildren(text, row);

  // the thing being pointed at, and the hole in the veil around it
  const found = await step.target();
  if (tour.steps[tour.step] !== step) return;   // the tour moved on while the window was answering
  const box = found instanceof Element ? found.getBoundingClientRect() : found;
  const pad = step.pad ?? 10;
  const hole = {left: box.left - pad, top: box.top - pad, right: box.right + pad, bottom: box.bottom + pad};
  const cut = $("tour-cut");
  cut.setAttribute("x", hole.left); cut.setAttribute("y", hole.top);
  cut.setAttribute("width", hole.right - hole.left); cut.setAttribute("height", hole.bottom - hole.top);
  cut.setAttribute("rx", Math.min(28, (hole.bottom - hole.top) / 2));

  // the note sits `from` away from the target, kept on screen
  const [dx, dy] = typeof step.from === "function" ? step.from() : step.from;
  const cx = (box.left + box.right) / 2, cy = (box.top + box.bottom) / 2;
  const w = note.offsetWidth, hgt = note.offsetHeight;
  const left = Math.max(24, Math.min(innerWidth - w - 24, cx + dx - w / 2));
  const top = Math.max(24, Math.min(innerHeight - hgt - 24, cy + dy - hgt / 2));
  note.style.left = `${left}px`; note.style.top = `${top}px`;

  // the arrow: from the edge of the note to the edge of the hole, bowed into an S
  const edge = (r, tx, ty) => {            // where the line from r's centre towards (tx, ty) leaves r
    const mx = (r.left + r.right) / 2, my = (r.top + r.bottom) / 2, vx = tx - mx, vy = ty - my;
    const k = Math.min(Math.abs((r.right - r.left) / 2 / (vx || 1e-6)), Math.abs((r.bottom - r.top) / 2 / (vy || 1e-6)));
    return [mx + vx * k, my + vy * k];
  };
  const noteBox = {left: left - 6, top: top - 6, right: left + w + 6, bottom: top + text.offsetHeight + 6};
  const [sx, sy] = edge(noteBox, cx, cy);
  const [ex, ey] = edge({left: hole.left - 8, top: hole.top - 8, right: hole.right + 8, bottom: hole.bottom + 8}, sx, sy);
  const len = Math.hypot(ex - sx, ey - sy) || 1, nx = -(ey - sy) / len, ny = (ex - sx) / len;   // unit normal
  const bend = step.bend * Math.min(1, len / 260);
  const c1 = [sx + (ex - sx) * .3 + nx * bend, sy + (ey - sy) * .3 + ny * bend];
  const c2 = [sx + (ex - sx) * .75 - nx * bend * .55, sy + (ey - sy) * .75 - ny * bend * .55];
  const d = `M${sx} ${sy} C${c1[0]} ${c1[1]} ${c2[0]} ${c2[1]} ${ex} ${ey}`;
  const path = $("tour-path"), mask = $("tour-mask"), head = $("tour-head");
  path.setAttribute("d", d); mask.setAttribute("d", d);
  const total = path.getTotalLength();
  mask.style.setProperty("--length", total); mask.style.strokeDasharray = total;
  const angle = Math.atan2(ey - c2[1], ex - c2[0]), wing = 15, spread = .5;
  head.setAttribute("d", `M${ex - wing * Math.cos(angle - spread)} ${ey - wing * Math.sin(angle - spread)} L${ex} ${ey} L${ex - wing * Math.cos(angle + spread)} ${ey - wing * Math.sin(angle + spread)}`);
  for (const part of [mask, head]) { part.style.animation = "none"; part.getBoundingClientRect(); part.style.animation = ""; }   // replay
}

function endTour() {
  tour.step = -1;
  hush();
  $("tour").hidden = true;
  tell({highlight: null});
  try { localStorage.setItem("onboarded", "1"); } catch {}
}

window.addEventListener("resize", () => { if (tour.step >= 0) drawStep(); });

function maybeTour() {
  let seen = false;
  try { seen = localStorage.getItem("onboarded") === "1"; } catch {}
  if (!seen || location.search === "?tour") showStep(0);
}

setPlaying(false);
// "#book=ID" opens that book straight away; the desktop app uses it for files opened with it
const wanted = location.hash.match(/^#book=([0-9a-f]{12})$/);
history.replaceState(null, "", location.pathname + location.search);
showLibrary().then(() => wanted ? openBook(wanted[1]) : maybeTour());
</script>
