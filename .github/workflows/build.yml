# Builds the desktop app: for Windows and macOS a self-contained build, for Linux a .deb, .rpm or pacman
# package per system and a .tar.gz for the others.
# Runs on every version tag (v1.0.0) and attaches the installers to a release;
# it can also be started by hand from the Actions tab, which only produces downloadable artifacts.
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      # the release notes are this version's section of CHANGELOG.md; the app shows them when it offers the update.
      # This fails when the tag, VERSION in app.py and CHANGELOG.md do not agree
      - name: Release notes
        if: github.ref_type == 'tag'
        shell: bash
        run: uv run --no-project --python 3.12 update.py "$GITHUB_REF_NAME" > release-notes.md

      - name: Make the macOS icon
        if: runner.os == 'macOS'
        run: |
          mkdir logo.iconset
          for size in 16 32 128 256 512; do
            sips -z $size $size static/logo.png --out logo.iconset/icon_${size}x${size}.png
          done
          iconutil -c icns logo.iconset -o static/logo.icns

      # gives the Windows program the app's icon (see build.py)
      - name: rcedit
        if: runner.os == 'Windows'
        shell: bash
        run: curl -fsSL -o rcedit.exe https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe

      - name: Build
        shell: bash
        run: RCEDIT="$PWD/rcedit.exe" uv run --no-project --python 3.12 build.py

      # the built app started without a window: it downloads PyTorch and the model as a first start does, and speaks
      - name: Check
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            app="dist/EMA Reader"; python="$app/python/python.exe"
          else
            app="dist/EMA Reader.app/Contents/Resources/app"; python="dist/EMA Reader.app/Contents/MacOS/python"
          fi
          "$python" "$app/desktop.py" --check
          # the NVIDIA download as well, kept apart; with no card here it loads on the processor
          if [ "$RUNNER_OS" = Windows ]; then
            EMA_READER_RUNTIME="$RUNNER_TEMP/cuda" EMA_READER_CHECK=cuda "$python" "$app/desktop.py" --check
          fi

      # the window is drawn by Microsoft's WebView2, which Windows 11 has and a Windows 10 may lack:
      # the installer carries Microsoft's small setup for it and runs it where it is missing (see windows.iss)
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -fsSL -o packaging/MicrosoftEdgeWebview2Setup.exe "https://go.microsoft.com/fwlink/p/?LinkId=2124703"
          version="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || version="0.0.0"
          iscc "//DVersion=$version" packaging/windows.iss

      - name: macOS disk image
        if: runner.os == 'macOS'
        # the app next to a link to the Applications folder, so that installing is dragging one onto the other
        run: |
          mkdir dist/dmg
          ditto "dist/EMA Reader.app" "dist/dmg/EMA Reader.app"
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "EMA Reader" -srcfolder dist/dmg -ov -format UDZO dist/EMA-Reader.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: ema-reader-${{ runner.os }}
          path: |
            dist/EMA-Reader-Setup.exe
            dist/EMA-Reader.dmg

      - name: Attach to the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            dist/EMA-Reader-Setup.exe
            dist/EMA-Reader.dmg

  # the Linux packages: built once, on the oldest system they support (see packaging/linux.py)
  linux:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - name: Build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y python3 ca-certificates gcc pkg-config \
            libgirepository-2.0-dev libcairo2-dev rpm libarchive-tools
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Release notes
        if: github.ref_type == 'tag'
        run: python3 update.py "$GITHUB_REF_NAME" > release-notes.md

      - name: Build
        run: python3 packaging/linux.py

      - uses: actions/upload-artifact@v4
        with:
          name: ema-reader-linux
          path: dist/EMA-Reader.*

      - name: Attach to the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: dist/EMA-Reader.*

  # each package installed the way a reader installs it on each system, then started without a window by an
  # ordinary user: it downloads PyTorch and the model as a first start does, and speaks a sentence
  linux-check:
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "ubuntu:24.04", package: deb }
          - { image: "ubuntu:24.04", package: deb, kind: cuda }   # the NVIDIA download, which loads on the processor here
          - { image: "ubuntu:26.04", package: deb }
          - { image: "debian:13", package: deb }
          - { image: "fedora:44", package: rpm }
          - { image: "archlinux:latest", package: pkg.tar.zst }
          - { image: "opensuse/tumbleweed", package: tar.gz }   # a system without a package of its own
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ema-reader-linux
      - name: Install
        run: |
          case ${{ matrix.package }} in
            deb) apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y ./EMA-Reader.deb ;;
            rpm) dnf install -y ./EMA-Reader.rpm ;;
            # nothing to install but what the window needs from the system; the folder is unpacked by the user below
            tar.gz) zypper --non-interactive install tar gzip shadow util-linux typelib-1_0-Gtk-4_0 typelib-1_0-Adw-1 typelib-1_0-WebKit-6_0 libgirepository-2_0-0 ;;
            *) pacman -Syu --noconfirm && pacman -U --noconfirm ./EMA-Reader.pkg.tar.zst ;;
          esac
      - name: Check
        run: |
          useradd -m okur
          if [ "${{ matrix.package }}" = tar.gz ]; then
            cp EMA-Reader.tar.gz /home/okur/
            runuser -u okur -- sh -c 'cd /home/okur && tar -xzf EMA-Reader.tar.gz && HOME=/home/okur ./ema-reader/install &&
              HOME=/home/okur ./ema-reader/python/bin/python3.13 ./ema-reader/desktop.py --check'
          else
            runuser -u okur -- env EMA_READER_CHECK=${{ matrix.kind }} ema-reader --check
          fi
