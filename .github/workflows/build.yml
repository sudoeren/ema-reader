# Builds the desktop app: for Windows and macOS a self-contained build, for Linux a .deb or .rpm per system
# and the Arch Linux PKGBUILD.
# Runs on every version tag (v1.0.0) and attaches the installers to a release;
# it can also be started by hand from the Actions tab, which only produces downloadable artifacts.
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      # the release notes are this version's section of CHANGELOG.md; the app shows them when it offers the update.
      # This fails when the tag, VERSION in app.py and CHANGELOG.md do not agree
      - name: Release notes
        if: github.ref_type == 'tag'
        shell: bash
        run: uv run --no-project --python 3.12 update.py "$GITHUB_REF_NAME" > release-notes.md

      - name: Make the macOS icon
        if: runner.os == 'macOS'
        run: |
          mkdir logo.iconset
          for size in 16 32 128 256 512; do
            sips -z $size $size static/logo.png --out logo.iconset/icon_${size}x${size}.png
          done
          iconutil -c icns logo.iconset -o static/logo.icns

      - name: Build
        run: uv run build.py

      - name: Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || version="0.0.0"
          iscc "//DVersion=$version" packaging/windows.iss

      - name: macOS disk image
        if: runner.os == 'macOS'
        run: hdiutil create -volname "EMA Reader" -srcfolder "dist/EMA Reader.app" -ov -format UDZO dist/EMA-Reader.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: ema-reader-${{ runner.os }}
          path: |
            dist/EMA-Reader-Setup.exe
            dist/EMA-Reader.dmg

      - name: Attach to the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            dist/EMA-Reader-Setup.exe
            dist/EMA-Reader.dmg

  # one package per system, each built in a container of that system (see packaging/linux.py)
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { system: ubuntu-24.04, image: "ubuntu:24.04" }
          - { system: ubuntu-26.04, image: "ubuntu:26.04" }
          - { system: debian-13, image: "debian:13" }
          - { system: fedora-44, image: "fedora:44" }
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - name: Build tools
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y python3 ca-certificates
          else
            dnf install -y python3 rpm-build
          fi
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Release notes
        if: github.ref_type == 'tag'
        run: python3 update.py "$GITHUB_REF_NAME" > release-notes.md

      - name: Build
        run: python3 packaging/linux.py ${{ matrix.system }}

      # installed the way a reader installs it, then started without a window by an ordinary user
      - name: Install and check
        run: |
          if command -v apt-get >/dev/null; then
            DEBIAN_FRONTEND=noninteractive apt-get install -y ./dist/EMA-Reader-${{ matrix.system }}.deb
          else
            dnf install -y ./dist/EMA-Reader-${{ matrix.system }}.rpm
          fi
          useradd -m okur
          runuser -u okur -- ema-reader --check

      - uses: actions/upload-artifact@v4
        with:
          name: ema-reader-${{ matrix.system }}
          path: dist/EMA-Reader-${{ matrix.system }}.*

      - name: Attach to the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: dist/EMA-Reader-${{ matrix.system }}.*

  # Arch Linux gets no ready-made package: the AUR's PKGBUILD builds it on the reader's computer.
  # This builds it the same way, installs it and checks it; for a version tag it also attaches the
  # PKGBUILD with the checksum of that version's source, ready to publish on the AUR
  arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Build tools
        run: pacman -Syu --noconfirm --needed base-devel git python
      - uses: actions/checkout@v4

      - name: Release notes
        if: github.ref_type == 'tag'
        run: python update.py "$GITHUB_REF_NAME" > release-notes.md

      - name: Build and install
        run: |
          mkdir -p /tmp/build dist
          cp packaging/arch/PKGBUILD /tmp/build/
          version=$(sed -n 's/^pkgver=//p' packaging/arch/PKGBUILD)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            # the source GitHub serves for the tag, as the AUR will fetch it
            sum=$(curl -fsSL "https://github.com/$GITHUB_REPOSITORY/archive/refs/tags/$GITHUB_REF_NAME.tar.gz" | sha256sum | cut -d' ' -f1)
            sed -i "s/^sha256sums=.*/sha256sums=('$sum')/" /tmp/build/PKGBUILD
            cp /tmp/build/PKGBUILD dist/PKGBUILD
          else
            # this commit, under the name its release would have
            git config --global --add safe.directory "$PWD"
            git archive --prefix="ema-reader-$version/" -o "/tmp/build/ema-reader-$version.tar.gz" HEAD
          fi
          # makepkg will not run as root; it installs the dependencies and the package with sudo
          useradd -m okur
          echo "okur ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/okur
          chown -R okur /tmp/build
          cd /tmp/build && runuser -u okur -- makepkg -si --noconfirm

      - name: Check
        run: runuser -u okur -- ema-reader --check

      - name: Attach to the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: dist/PKGBUILD
