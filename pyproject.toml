[project]
name = "ema-reader"
version = "1.0.0"
description = "A book and article reader that speaks Turkish text with the EMA Lightning model"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ema-lightning>=1.0.1",
    "pypdf>=6.19.0",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "trafilatura>=2.3.1",
]

[project.optional-dependencies]
# the native window of the desktop app; Linux needs the Qt backend, Windows and macOS use the system web view
desktop = [
    "pygobject>=3.50 ; sys_platform == 'linux'",
    "pywebview>=5",
    "pywebview[qt]>=5; sys_platform == 'linux'",
]
